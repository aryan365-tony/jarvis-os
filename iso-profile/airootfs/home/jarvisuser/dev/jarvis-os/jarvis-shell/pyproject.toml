[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-shell"
version = "0.2.0"
description = "AI-first, voice-first kiosk shell for Jarvis-OS"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    # tomllib is stdlib on 3.11+; tomli is a fallback for older interpreters.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.memory" = ["migrations/*.sql"]
"jarvis.ui" = ["*.tcss"]
