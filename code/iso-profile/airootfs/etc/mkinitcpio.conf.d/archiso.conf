# PXE/network-boot hooks removed: this image boots from USB/optical/VM only, and
# those hooks require extra packages (mkinitcpio-nfs-utils, nbd) that were
# trimmed to keep the ISO small. Dropping them also fixes the mkinitcpio errors
# for ipconfig/nbd-client/nfsmount.
HOOKS=(base udev plymouth microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
